    <p class="boot-tag">BEST VIEWED AFTER MIDNIGHT</p>
    <div id="boot-log" role="status" aria-live="polite"></div>
    <div id="boot-actions">
      <button id="enter-sound" type="button" class="boot-enter">ENTER QUINN</button>
      <button id="enter-silent" type="button" class="boot-quiet">enter without sound</button>

  <div class="boot-scan" aria-hidden="true"></div>

<!-- ─────────────────────────────────────────────── DESKTOP ───────── -->
<div id="desktop">

  <div id="bg" aria-hidden="true">
    <div class="bg-sigil"></div>
    <div class="bg-scan"></div>
    <div class="bg-noise"></div>
    <div class="bg-vig"></div>
  </div>


  <main id="collage">

  <nav id="icons" aria-label="Desktop shortcuts">
    <button class="dicon" type="button" data-open="photos">
      <img src="assets/icons/photos.png" alt="" width="32" height="32"><span>PHOTOS</span></button>
    <button class="dicon" type="button" data-open="game">
      <img src="assets/icons/game.png" alt="" width="32" height="32"><span>SIGIL_SWARM</span></button>
    <button class="dicon" type="button" data-open="guestbook">
      <img src="assets/icons/book.png" alt="" width="32" height="32"><span>GUESTBOOK</span></button>
    <button class="dicon" type="button" data-open="terminal">
      <img src="assets/icons/term.png" alt="" width="32" height="32"><span>QK-DOS</span></button>
    <button class="dicon" type="button" data-open="readme">
      <img src="assets/icons/txt.png" alt="" width="32" height="32"><span>README.TXT</span></button>
  </nav>


    <div class="mark" data-depth="0.14">
      <h1 class="wordmark">
        <span class="wm-line" data-text="QUINN">QUINN</span>
        <span class="wm-line wm-line-b" data-text="KERRIGAN">KERRIGAN</span>
      </h1>
      <p id="status-line" class="status">QUINN WAS HERE</p>
    </div>

    <img id="coffin" class="figure" data-depth="0.34"
         src="assets/quinn/quinn-01-coffin.webp"
         alt="Quinn photographed in front of a wall of license plates, cropped into a coffin shape."
         width="760" height="1010" fetchpriority="high" decoding="async">

    <img id="cutout" class="figure" data-depth="0.52"
         src="assets/quinn/quinn-05-transparent-cutout.webp"
         alt="Full body cut-out of Quinn standing."
         width="820" height="1480" loading="lazy" decoding="async">

    <button id="arch-portal" type="button" data-depth="0.24"
            aria-label="Open the photo portal">
      <img src="assets/quinn/quinn-05-gothic-arch.webp"
           alt="" width="700" height="1010" loading="lazy" decoding="async">
      <span class="portal-label">ENTER THE PHOTOS</span>
    </button>

    <button id="halo-portrait" type="button" data-depth="0.7"
            aria-label="Night portrait of Quinn. Something happens if you keep tapping it.">
      <img src="assets/quinn/quinn-04-night-halo-sm.webp"
           alt="" width="300" height="300" loading="lazy" decoding="async">
      <span class="halo-ring-2" aria-hidden="true"></span>
    </button>

    <img class="strip strip-fire" src="assets/gifs/fire-divider.gif" data-gif="fire-divider"
         alt="" width="128" height="13" loading="lazy" data-depth="0.3">
    <img class="strip strip-work" src="assets/gifs/construction.gif" data-gif="construction"
         alt="" width="104" height="22" loading="lazy" data-depth="0.4">
    <img class="strip strip-thorn" src="assets/gifs/thorn-divider.gif" data-gif="thorn-divider"
         alt="" width="180" height="14" loading="lazy" data-depth="0.2">

    <!-- ambient windows are appended here by the window manager -->
  </main>

  <div id="decor"></div>
  <div id="winlayer"></div>

  <div id="start-menu" hidden role="menu" aria-label="Start"></div>

  <footer id="taskbar">
    <button id="start-btn" type="button" aria-haspopup="menu" aria-expanded="false">
      <img src="assets/sigil-mark.svg" alt="" width="16" height="16">
      <span>QK</span>
    </button>

    <div id="task-strip"></div>

    <div class="tb-right">
      <span class="tb-cell tb-secrets">SECRETS&nbsp;<b id="secret-count">0/7</b></span>
      <span class="tb-cell tb-hits">HITS&nbsp;<span id="hits"></span></span>
      <button id="chaos-toggle" class="tb-btn" type="button" aria-pressed="false">
        <span>REDUCE CHAOS</span></button>
      <button id="mute-toggle" class="tb-btn" type="button" aria-pressed="false">
        <span>SOUND ON</span></button>
      <span class="tb-cell tb-clock" id="clock" aria-label="Clock"><b>00</b><i>:</i><b>00</b></span>
      <b id="night-flag" class="tb-cell tb-night" hidden>666</b>
      <button id="skull-key" type="button" aria-label="Unmarked key">
        <img src="assets/icons/skull.png" alt="" width="16" height="16"></button>
    </div>
  </footer>

</div>

<div id="toasts" aria-live="polite"></div>
